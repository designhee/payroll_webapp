<style>
:root{--green:#173d35;--mint:#eaf3ee;--line:#dce5e0;--ink:#1e2b26;--muted:#69766f;--white:#fff;--orange:#c06c36}*{box-sizing:border-box}body{margin:0;background:#f5f7f5;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.45}.wrap{max-width:850px;margin:auto;padding:18px 14px 48px}.hero{background:var(--green);color:white;padding:24px 20px;border-radius:22px;margin-bottom:16px}.eyebrow{font-size:12px;letter-spacing:.12em;opacity:.8}.hero h1{font-size:27px;margin:6px 0}.hero p{margin:0;color:#dce9e2;font-size:14px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 4px 14px #15392b08}.card h2{font-size:17px;margin:0 0 12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}label{font-size:13px;font-weight:650;display:block;margin-bottom:6px}.field{flex:1;min-width:130px}input,select,textarea{font:inherit;width:100%;border:1px solid #ccd8d1;border-radius:11px;padding:12px;background:#fff;color:var(--ink)}textarea{min-height:185px;resize:vertical;line-height:1.5}.hint{font-size:12px;color:var(--muted);margin:8px 0 0}.btn{border:0;border-radius:11px;padding:12px 15px;font-weight:700;font-size:14px;cursor:pointer}.primary{background:var(--green);color:white}.secondary{background:var(--mint);color:var(--green)}.danger{background:#fff0eb;color:#9a4424}.full{width:100%;margin-top:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:var(--mint);border-radius:13px;padding:12px}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;font-size:17px;margin-top:4px;overflow-wrap:anywhere}.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;white-space:nowrap;font-size:12px}th,td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:right}th{background:#edf4ef;color:#31483d;font-weight:700}th:first-child,td:first-child{text-align:left}tbody tr:last-child td{border-bottom:0}.empty{padding:22px;text-align:center;color:var(--muted);font-size:14px}.section-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.section-head h2{margin:0}.tiny{font-size:11px;color:var(--muted)}.toast{display:none;padding:10px 12px;background:#e8f5eb;border-radius:10px;color:#205a35;font-size:13px;margin-top:10px}.note{font-size:12px;color:var(--muted);line-height:1.6}.pill{display:inline-block;background:#f5eee4;color:#89572b;border-radius:30px;padding:4px 8px;font-size:11px;margin-left:5px}.deduction-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:12px}.deduction-item{background:#f7f9f7;border:1px solid var(--line);border-radius:10px;padding:9px 10px;display:flex;justify-content:space-between;gap:8px;font-size:12px}.deduction-item strong{white-space:nowrap}.detail-cell{min-width:100px;text-align:center}details summary{cursor:pointer;color:var(--green);font-weight:700}details ul{padding-left:18px;text-align:left;white-space:normal;min-width:180px}details li{margin:4px 0}@media(max-width:520px){.deduction-list{grid-template-columns:1fr}.detail-cell details ul{min-width:150px}.wrap{padding:12px 10px 34px}.hero{border-radius:18px;padding:21px 17px}.hero h1{font-size:24px}.card{padding:15px}.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:span 2}.btn{padding:11px 12px}.row{min-width:0}.row .field{flex:1 1 100%;min-width:0;width:100%}.row input,.row select{min-width:0;max-width:100%}}

/* Responsive layout: inputs and controls adapt to the available viewport width. */
.wrap{width:min(100%,850px);padding-inline:clamp(10px,2.5vw,18px)}
.card{min-width:0}
.row{min-width:0;align-items:stretch}
.row .field{flex:1 1 240px;min-width:0;width:auto}
input,select,textarea{display:block;min-width:0;max-width:100%;font-size:16px}
textarea{height:clamp(150px,28vh,320px);min-height:150px;width:100%}
.row>.btn{max-width:100%;white-space:normal}
.table-wrap{width:100%;max-width:100%;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.deduction-list{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
@media(max-width:700px){
  .wrap{padding-top:12px}
  .hero{padding:clamp(17px,4vw,24px)}
  .card{padding:clamp(13px,3.5vw,18px)}
  .row .field{flex:1 1 100%;width:100%}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats .stat{min-width:0}
  .stat strong{font-size:clamp(14px,3.8vw,17px)}
}
@media(max-width:380px){
  .wrap{padding-inline:8px}
  .hero,.card{border-radius:15px}
  .hero h1{font-size:22px}
  .row{gap:8px}
  .row>.btn{flex:1 1 100%;width:100%}

}

  .row .field{flex-basis:calc(50% - 10px)}
}

/* iPhone SE (375px) and narrow viewport fix: keep the native month picker inside its field. */
.row > .field{box-sizing:border-box;min-width:0;max-width:100%;}
.row > .field > input,
.row > .field > select{box-sizing:border-box;width:100%;min-width:0;max-width:100%;}
input[type="month"]{box-sizing:border-box;display:block;width:100%;min-width:0;max-width:100%;padding-left:8px;padding-right:8px;}
input[type="month"]::-webkit-date-and-time-value{min-width:0;text-align:left;}
@media(max-width:390px){
  .wrap{width:100%;min-width:0;overflow-x:clip;}
  .card,.row,.row > .field{min-width:0;max-width:100%;}
  .row > .field{flex:1 1 100%;width:100%;}
  input[type="month"]{font-size:16px;padding-left:7px;padding-right:7px;}
}

</head>
<body><main class="wrap">
<header class="hero"><div class="eyebrow">PERSONAL PAYROLL TRACKER</div><h1>급여 정리 📦</h1><p>급여 문자 붙여넣기 → 월별 표 자동 정리</p></header>
<section class="card"><h2>1. 급여 문자 입력</h2><div class="row"><div class="field"><label for="month">급여 월</label><input id="month" type="month"></div><div class="field"><label for="label">메모 (선택)</label><input id="label" placeholder="예: 연차 포함"></div></div><div style="margin-top:13px"><label for="sms">급여명세서 문자</label><textarea id="sms" placeholder="급여명세서 문자 전체를 여기에 붙여넣으세요. 지급총액, 공제액계, 차인지급액 등을 자동으로 읽어옵니다."></textarea></div><div class="row" style="margin-top:12px"><button class="btn primary" id="parse">문자 분석하기</button><button class="btn secondary" id="clearInput">입력 지우기</button></div><div class="hint">개인정보 보호를 위해 입력한 내용은 이 브라우저에만 저장됩니다. 서버로 전송하지 않습니다.</div><div id="toast" class="toast"></div></section>
<section class="card" id="previewCard" hidden><h2>2. 분석 결과 확인</h2><div class="stats" id="previewStats"></div><div id="deductionPreview"></div><p class="note" id="previewNote"></p><div class="row" style="margin-top:12px"><button class="btn primary" id="save">이 달 기록 저장</button><button class="btn secondary" id="cancelPreview">취소</button></div></section>
<section class="card"><div class="section-head"><h2>월별 급여 기록</h2><span class="tiny" id="count">0개월</span></div><div class="stats" id="totals"></div><div class="table-wrap" style="margin-top:14px"><table><thead><tr><th>월</th><th>기본급</th><th>잔업</th><th>기타 수당</th><th>세전 총액</th><th>공제액</th><th>실수령액</th><th>공제 상세</th><th>잔업시간</th><th>관리</th></tr></thead><tbody id="tbody"></tbody></table><div id="empty" class="empty">아직 저장된 급여가 없어요.<br>위에서 급여 문자를 붙여넣어 시작하세요.</div></div><div class="row" style="margin-top:13px"><button class="btn secondary" id="export">CSV로 내보내기</button><button class="btn danger" id="deleteAll">전체 기록 삭제</button></div><p class="note">CSV 파일은 엑셀이나 Numbers에서 열 수 있어요. 백업을 위해 가끔 내보내기를 권장합니다.</p></section>

</main>
<script>
const $=id=>document.getElementById(id);let draft=null;const KEY='payroll_records_v1';
const money=n=>Number.isFinite(n)?Math.round(n).toLocaleString('ko-KR')+'원':'—';
function records(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return []}}function setRecords(a){localStorage.setItem(KEY,JSON.stringify(a))}
function extract(pattern,text){const m=text.match(pattern);if(!m)return null;const raw=(m[1]||'').replace(/,/g,'');const n=Number(raw);return Number.isFinite(n)?n:null}
function parseText(t,month, memo){const find=(name)=>extract(new RegExp(name+'\\s*([0-9,]+)'),t);const between=(label)=>extract(new RegExp(label+'\\s*\\(?\\s*(?:시간|일수)?\\s*([0-9,]+)'),t);const basic=find('기본[^\\n]*?금액\\s*');
// Read values from common Korean payroll SMS formats.
const val=(re)=>extract(re,t);const get=(label)=>val(new RegExp(label+'[^\\n]*?(?:금액|:)\\s*([0-9,]+)'));
const base=val(/기본\s*\([^)]*?금액\s*([0-9,]+)/)||val(/기본[^\n]*?금액\s*([0-9,]+)/);
const overtime=val(/잔업\s*\([^)]*?금액\s*([0-9,]+)/)||val(/잔업[^\n]*?금액\s*([0-9,]+)/);
const total=val(/지급총액\s*([0-9,]+)/);const deductions=val(/공제액계\s*([0-9,]+)/);const net=val(/차인지급액\s*:\s*([0-9,]+)/)||val(/차인지급액\s*([0-9,]+)/);
const otHours=val(/잔업\s*\(\s*시간\s*([0-9.]+)/)||val(/잔업\s*시간\s*([0-9.]+)/);
const sat=val(/토요근무\s*\([^)]*?금액\s*([0-9,]+)/)||0;const holiday=val(/휴일근무\s*\([^)]*?금액\s*([0-9,]+)/)||0;const weekly=val(/주휴수당\s*\([^)]*?금액\s*([0-9,]+)/)||0;const meal=val(/중식석식\s*\([^)]*?금액\s*([0-9,]+)/)||0;const early=val(/조출수당\s*\([^)]*?금액\s*([0-9,]+)/)||0;
// 세금·보험·기타 공제 항목을 각각 저장합니다. 비어 있거나 명세서에 없는 항목은 0원으로 처리합니다.
const deductionLabels=[['pension','국민연금'],['health','건강보험'],['care','장기요양'],['employment','고용보험'],['roomC','ROOM-C'],['yearEnd','연말정산'],['advance','가불금'],['insuranceAdjust','4대보험정산'],['pensionAdjust','연금정산'],['etcDeduction','기타'],['incomeTax','소득세'],['localTax','지방소득세'],['agriTax','농특세']];
const deductionItems=Object.fromEntries(deductionLabels.map(([key,label])=>[key,val(new RegExp(label+'\\s*([0-9,]+)'))||0]));
const calculatedOther=(sat+holiday+weekly+meal+early);const gross=total??((base||0)+(overtime||0)+calculatedOther);const deduction=deductions??(gross-(net??0));const takehome=net??(gross-deduction);
return {month,memo,base:base??0,overtime:overtime??0,sat,holiday,weekly,meal,early,other:calculatedOther,gross,deductions:deduction,deductionItems,net:takehome,otHours:otHours??0,raw:t,parsed:{base:base!==null,total:total!==null,deductions:deductions!==null,net:net!==null}}}
function won(x){return (x||0).toLocaleString('ko-KR')}
function showToast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3200)}
function renderPreview(r){$('previewCard').hidden=false;$('previewStats').innerHTML=[['세전 지급총액',money(r.gross)],['총공제액',money(r.deductions)],['실수령액',money(r.net)]].map(([a,b])=>`<div class="stat"><span>${a}</span><strong>${b}</strong></div>`).join('');const dlabels=[['pension','국민연금'],['health','건강보험'],['care','장기요양보험'],['employment','고용보험'],['roomC','ROOM-C'],['yearEnd','연말정산'],['advance','가불금'],['insuranceAdjust','4대보험 정산'],['pensionAdjust','연금 정산'],['etcDeduction','기타 공제'],['incomeTax','소득세'],['localTax','지방소득세'],['agriTax','농특세']];$('previewStats').insertAdjacentHTML('afterend',`<h3 style="font-size:14px;margin:16px 0 0">공제 항목 상세</h3><div class="deduction-list">${dlabels.map(([k,n])=>`<div class="deduction-item"><span>${n}</span><strong>${money((r.deductionItems||{})[k]||0)}</strong></div>`).join('')}</div>`);const missing=[];if(!r.parsed.base)missing.push('기본급');if(!r.parsed.total)missing.push('지급총액');if(!r.parsed.deductions)missing.push('공제액계');if(!r.parsed.net)missing.push('차인지급액');$('previewNote').textContent=missing.length?'자동으로 찾지 못한 항목: '+missing.join(', ')+'. 값이 맞는지 확인한 뒤 저장하세요.':'주요 금액 항목을 모두 찾았어요. 저장 전에 금액을 확인하세요.'}
$('parse').onclick=()=>{const month=$('month').value;const t=$('sms').value.trim();if(!month){showToast('급여 월을 먼저 선택해 주세요.');return}if(!t){showToast('급여 문자를 붙여넣어 주세요.');return}draft=parseText(t,month,$('label').value.trim());renderPreview(draft)};
$('save').onclick=()=>{if(!draft)return;let a=records();const i=a.findIndex(x=>x.month===draft.month);if(i>=0){if(!confirm(draft.month+' 기록이 있어요. 새 내용으로 덮어쓸까요?'))return;a[i]=draft}else a.push(draft);a.sort((x,y)=>x.month.localeCompare(y.month));setRecords(a);draft=null;$('previewCard').hidden=true;render();showToast('급여 기록을 저장했어요.')};$('cancelPreview').onclick=()=>{$('previewCard').hidden=true;draft=null};$('clearInput').onclick=()=>{$('sms').value='';$('label').value='';$('previewCard').hidden=true;draft=null};
function render(){const a=records();$('count').textContent=a.length+'개월';const sum=k=>a.reduce((s,x)=>s+(Number(x[k])||0),0);$('totals').innerHTML=[['누적 세전 급여',money(sum('gross'))],['누적 공제액',money(sum('deductions'))],['누적 실수령액',money(sum('net'))]].map(([a,b])=>`<div class="stat"><span>${a}</span><strong>${b}</strong></div>`).join('');$('tbody').innerHTML=a.map(x=>{const labels=[['pension','국민연금'],['health','건강보험'],['care','장기요양보험'],['employment','고용보험'],['roomC','ROOM-C'],['yearEnd','연말정산'],['advance','가불금'],['insuranceAdjust','4대보험 정산'],['pensionAdjust','연금 정산'],['etcDeduction','기타 공제'],['incomeTax','소득세'],['localTax','지방소득세'],['agriTax','농특세']];const di=x.deductionItems||{};return `<tr><td>${x.month}${x.memo?'<br><span class="tiny">'+escapeHtml(x.memo)+'</span>':''}</td><td>${won(x.base)}</td><td>${won(x.overtime)}</td><td>${won(x.other)}</td><td><b>${won(x.gross)}</b></td><td>${won(x.deductions)}</td><td><b>${won(x.net)}</b></td><td class="detail-cell"><details><summary>상세 보기</summary><ul>${labels.map(([k,n])=>`<li>${n}: ${won(di[k]||0)}원</li>`).join('')}</ul></details></td><td>${x.otHours||0}h</td><td><button class="btn danger" style="padding:6px 8px" onclick="removeRecord('${x.month}')">삭제</button></td></tr>`}).join('');$('empty').style.display=a.length?'none':'block'}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}window.removeRecord=m=>{if(confirm(m+' 기록을 삭제할까요?')){setRecords(records().filter(x=>x.month!==m));render()}};
$('export').onclick=()=>{const a=records();if(!a.length){showToast('내보낼 기록이 없어요.');return}const cols=[['month','급여월'],['base','기본급'],['overtime','잔업수당'],['sat','토요근무수당'],['holiday','휴일근무수당'],['weekly','주휴수당'],['meal','중식석식수당'],['early','조출수당'],['gross','세전 지급총액'],['deductions','공제액'],['deductionItems.pension','국민연금'],['deductionItems.health','건강보험'],['deductionItems.care','장기요양보험'],['deductionItems.employment','고용보험'],['deductionItems.roomC','ROOM-C'],['deductionItems.yearEnd','연말정산'],['deductionItems.advance','가불금'],['deductionItems.insuranceAdjust','4대보험정산'],['deductionItems.pensionAdjust','연금정산'],['deductionItems.etcDeduction','기타공제'],['deductionItems.incomeTax','소득세'],['deductionItems.localTax','지방소득세'],['deductionItems.agriTax','농특세'],['net','실수령액'],['otHours','잔업시간'],['memo','메모']];const csv='\uFEFF'+[cols.map(c=>c[1]).join(','),...a.map(x=>cols.map(c=>{const v=c[0].startsWith('deductionItems.')?(x.deductionItems||{})[c[0].split('.')[1]]:x[c[0]];return '"'+String(v??'').replace(/"/g,'""')+'"'}).join(','))].join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='월별_급여정리.csv';link.click();URL.revokeObjectURL(url)};
$('deleteAll').onclick=()=>{if(confirm('저장된 모든 급여 기록을 삭제할까요? 이 작업은 되돌릴 수 없어요.')){setRecords([]);render()}};
const now=new Date();$('month').value=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;render();
</script><script>if("serviceWorker" in navigator && location.protocol.startsWith("http")){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}</script></body></html>
